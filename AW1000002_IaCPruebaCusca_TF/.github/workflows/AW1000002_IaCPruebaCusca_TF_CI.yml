name: AW1000002_IaCPruebaCusca_TF_CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform -chdir=Infra fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=Infra init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=Infra validate

  plan:
    needs: validate
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform -chdir=Infra init

      - name: Terraform Plan
        run: terraform -chdir=Infra plan -var-file=prod.tfvars

  deploy:
    needs: plan
    name: Terraform Deploy
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform -chdir=Infra init

      - name: Terraform Plan
        run: terraform -chdir=Infra plan -var-file=prod.tfvars -out=tfplan

      - name: Terraform Apply
        run: terraform -chdir=Infra apply -auto-approve tfplan