
replicaCount: 2

image:
  repository: "861536898248.dkr.ecr.us-east-1.amazonaws.com/pruebatecnica/cusca"
  tag: "latest"
  pullPolicy: IfNotPresent

containerPort: 8081

config:
  environment: production
  featureEnabled: true
  secretMask: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

ingress:
  enabled: true
  className: alb
  scheme: internet-facing
  targetType: ip
  host: ""
  path: /
  pathType: Prefix
  healthcheckPath: /actuator/health/readiness
  successCodes: "200"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081