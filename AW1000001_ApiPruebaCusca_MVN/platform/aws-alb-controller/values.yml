clusterName: prueba-tecnica-cusca-eks-cluster-app
region: us-east-1
vpcId: vpc-0c2a321be59badc0d

replicaCount: 2
revisionHistoryLimit: 10

image:
  repository: 861536898248.dkr.ecr.us-east-1.amazonaws.com/pruebatecnica/cusca-dependencies
  tag: aws-load-balancer-controller-v3.6.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: aws-load-balancer-controller
  automountServiceAccountToken: true

rbac:
  create: true

ingressClass: alb
createIngressClassResource: true

defaultTargetType: ip
defaultLoadBalancerScheme: internet-facing
enableServiceMutatorWebhook: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi