replicas: 2
revisionHistoryLimit: 5

image:
  repository: 861536898248.dkr.ecr.us-east-1.amazonaws.com/pruebatecnica/cusca-dependencies
  tag: metrics-server-v0.9.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: metrics-server

rbac:
  create: true

apiService:
  create: true
  insecureSkipTLSVerify: true

hostNetwork:
  enabled: false

defaultArgs:
  - --cert-dir=/tmp
  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  - --kubelet-use-node-status-port
  - --metric-resolution=15s

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    cpu: 250m
    memory: 300Mi

priorityClassName: system-cluster-critical