apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-vault-secrets
  namespace: prueba-cusca
  labels:
    app.kubernetes.io/part-of: prueba-cusca
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault.prueba-cusca.svc:8200"
    roleName: "app-csi"
    kubernetesAuthPath: "kubernetes-development"
    objects: |
      - objectName: "app-config"
        secretPath: "secret/data/test-app"
        secretKey: "app-config"
