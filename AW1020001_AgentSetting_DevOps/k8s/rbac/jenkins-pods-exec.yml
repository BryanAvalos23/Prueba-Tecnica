apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-pods-exec
  namespace: prueba-cusca
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-pods-exec-binding
  namespace: prueba-cusca
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: prueba-cusca
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-pods-exec