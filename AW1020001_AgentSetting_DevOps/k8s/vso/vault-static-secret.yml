apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: jenkins-vault-secret
  namespace: prueba-cusca
spec:
  type: kv-v2
  mount: secret
  path: jenkins/test
  refreshAfter: 60s
  vaultAuthRef: jenkins-vault-auth
  destination:
    create: true
    name: jenkins-vault-secret
  hmacSecretData: true
