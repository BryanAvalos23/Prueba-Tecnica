
apiVersion: v1
kind: Pod
metadata:
  name: vault-agent-test
  namespace: prueba-cusca
spec:
  serviceAccountName: jenkins-agent
  restartPolicy: Never
  automountServiceAccountToken: true
  containers:
    - name: test
      image: python:3.12-alpine
      command: ["python", "-c"]
      args:
        - |
          import json
          import urllib.request
          import urllib.error

          base = "http://vault:8200"
          jwt_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"

          with open(jwt_path, "r") as f:
              jwt = f.read().strip()

          def request(path, payload=None, token=None):
              data = json.dumps(payload).encode() if payload is not None else None
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["X-Vault-Token"] = token
              req = urllib.request.Request(
                  base + path, data=data, headers=headers
              )
              with urllib.request.urlopen(req, timeout=10) as response:
                  return json.loads(response.read())

          try:
              auth = request(
                  "/v1/auth/kubernetes/login",
                  {"role": "jenkins-agent", "jwt": jwt}
              )
              vault_token = auth["auth"]["client_token"]
              print("Autenticacion Kubernetes Auth: OK")
              print("Politicas:", auth["auth"]["policies"])

              result = request(
                  "/v1/secret/data/jenkins/test",
                  token=vault_token
              )
              value = result["data"]["data"].get("APP_SECRET")
              print("Lectura del secreto:", "OK" if value else "VALOR INESPERADO")
              print("Valor de prueba:", value if value == "Valor del secreto" else "[oculto]")
          except urllib.error.HTTPError as e:
              print("Error HTTP:", e.code)
              print("Revisar rol, policy, ServiceAccount y ruta del secreto")
          except Exception as e:
              print("Error de prueba:", type(e).__name__)
          finally:
              jwt = None
              vault_token = None